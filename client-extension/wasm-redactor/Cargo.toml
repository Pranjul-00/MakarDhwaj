[package]
name = "wasm-redactor"
version = "0.1.0"
edition = "2021"
description = "High performance WASM pixel redactor for web vision agent"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.99"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3.76", features = ["console"] }

[profile.release]
opt-level = 3
lto = true
