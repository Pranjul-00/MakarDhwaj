<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakarDhwaj Test Playground</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    h1 { margin-top: 0; font-size: 20px; color: #38bdf8; font-weight: 600; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #cbd5e1; }
    input {
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.15s;
    }
    #submit-btn { background: #3b82f6; color: white; }
    #submit-btn:hover { opacity: 0.9; }
    #reset-btn { background: #334155; color: #cbd5e1; }
    #status-banner {
      margin-top: 20px;
      padding: 12px 14px;
      background: #064e3b;
      border: 1px solid #10b981;
      color: #ecfdf5;
      border-radius: 6px;
      display: none;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MakarDhwaj Test Playground</h1>
    <p>Sample interactive form with PII fields (Email, Password, Credit Card) to verify local privacy redaction and automated DOM execution.</p>

    <form id="sample-form">
      <div class="form-group">
        <label for="username">Full Name (Public)</label>
        <input type="text" id="username" placeholder="Alex Morgan" value="Alex Morgan">
      </div>

      <div class="form-group">
        <label for="email">Email Address (PII - Censored)</label>
        <input type="email" id="email" placeholder="alex@privacy-agent.dev" value="alex@privacy-agent.dev">
      </div>

      <div class="form-group">
        <label for="password">Password (PII - Censored)</label>
        <input type="password" id="password" value="SuperSecretPassword123!">
      </div>

      <div class="form-group">
        <label for="card">Credit Card (PII - Censored)</label>
        <input type="text" id="card" name="card_number" value="4532 8921 7734 0019">
      </div>

      <div class="btn-group">
        <button type="submit" id="submit-btn">Submit Privacy Form</button>
        <button type="button" id="reset-btn">Reset</button>
      </div>
    </form>

    <div id="status-banner">SUCCESS: Form submitted autonomously!</div>
  </div>

  <script>
    let clickCount = 0;
    function handleSubmit(e) {
      if (e) { e.preventDefault(); }
      clickCount++;
      const banner = document.getElementById('status-banner');
      if (banner) {
        banner.style.display = 'block';
        banner.textContent = `SUCCESS (Click #${clickCount}): Form submitted autonomously by MakarDhwaj Agent at ${new Date().toLocaleTimeString()}!`;
      }
    }

    // Attach listeners with capturing phase so synthetic events trigger 100% reliably
    const submitBtn = document.getElementById('submit-btn');
    const form = document.getElementById('sample-form');
    const resetBtn = document.getElementById('reset-btn');

    if (submitBtn) {
      submitBtn.addEventListener('click', handleSubmit, true);
    }
    if (form) {
      form.addEventListener('submit', handleSubmit, true);
    }
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        const banner = document.getElementById('status-banner');
        if (banner) banner.style.display = 'none';
      }, true);
    }

    // Expose on window for direct agent access
    window.handleSubmit = handleSubmit;
  </script>
</body>
</html>
