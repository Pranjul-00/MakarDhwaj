<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakarDhwaj Test Playground</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #cbd5e1; }
    input {
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    #submit-btn { background: #6366f1; color: white; }
    #submit-btn:hover { background: #4f46e5; }
    #reset-btn { background: #334155; color: #cbd5e1; }
    #status-banner {
      margin-top: 20px;
      padding: 12px;
      background: #022c22;
      border: 1px solid #059669;
      color: #6ee7b7;
      border-radius: 6px;
      display: none;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MakarDhwaj Agent Test Playground</h1>
    <p>This sample page contains PII fields to test on-device privacy redaction and automated DOM interaction.</p>

    <form id="sample-form" onsubmit="event.preventDefault(); handleSubmit();">
      <div class="form-group">
        <label for="username">Full Name (Public Info)</label>
        <input type="text" id="username" placeholder="Alex Morgan" value="Alex Morgan">
      </div>

      <div class="form-group">
        <label for="email">Email Address (PII - Should be Redacted)</label>
        <input type="email" id="email" placeholder="alex@privacy-agent.dev" value="alex@privacy-agent.dev">
      </div>

      <div class="form-group">
        <label for="password">Password (Sensitive - Should be Redacted)</label>
        <input type="password" id="password" value="SuperSecretPassword123!">
      </div>

      <div class="form-group">
        <label for="card">Credit Card Number (PII - Should be Redacted)</label>
        <input type="text" id="card" name="card_number" value="4532 8921 7734 0019">
      </div>

      <div class="btn-group">
        <button type="submit" id="submit-btn">Submit Privacy Form</button>
        <button type="button" id="reset-btn" onclick="alert('Reset clicked!')">Clear</button>
      </div>
    </form>

    <div id="status-banner">Success: Submit Button was clicked by MakarDhwaj Agent!</div>
  </div>

  <script>
    function handleSubmit() {
      const banner = document.getElementById('status-banner');
      banner.style.display = 'block';
      banner.textContent = 'Submit Form action executed successfully at ' + new Date().toLocaleTimeString();
    }
  </script>
</body>
</html>
