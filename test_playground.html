<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakarDhwaj Test Playground</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      background: #18181b;
      padding: 32px;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.8);
      border: 1px solid #27272a;
    }
    h1 { margin-top: 0; font-size: 22px; color: #ef4444; font-weight: 700; }
    p { font-size: 13px; color: #a1a1aa; margin-bottom: 24px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #d4d4d8; letter-spacing: 0.05em; }
    input {
      padding: 11px 14px;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #ef4444; }
    .btn-group { display: flex; gap: 12px; margin-top: 24px; }
    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }
    #submit-btn { background: #dc2626; color: white; }
    #submit-btn:hover { background: #b91c1c; }
    #submit-btn:active { background: #991b1b; }
    #reset-btn { background: #27272a; color: #d4d4d8; }
    #status-banner {
      margin-top: 20px;
      padding: 14px 16px;
      background: #064e3b;
      border: 2px solid #10b981;
      color: #ecfdf5;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MakarDhwaj Perception Playground</h1>
    <p>This form contains PII fields (Email, Password, Credit Card) to test real-time WebAssembly privacy masking and automated UI interactions.</p>

    <form id="sample-form" onsubmit="event.preventDefault(); handleSubmit();">
      <div class="form-group">
        <label for="username">Full Name (Public)</label>
        <input type="text" id="username" placeholder="Alex Morgan" value="Alex Morgan">
      </div>

      <div class="form-group">
        <label for="email">Email Address (PII - Censored)</label>
        <input type="email" id="email" placeholder="alex@privacy-agent.dev" value="alex@privacy-agent.dev">
      </div>

      <div class="form-group">
        <label for="password">Password (PII - Censored)</label>
        <input type="password" id="password" value="SuperSecretPassword123!">
      </div>

      <div class="form-group">
        <label for="card">Credit Card (PII - Censored)</label>
        <input type="text" id="card" name="card_number" value="4532 8921 7734 0019">
      </div>

      <div class="btn-group">
        <button type="submit" id="submit-btn" onclick="handleSubmit()">Submit Privacy Form</button>
        <button type="button" id="reset-btn" onclick="document.getElementById('status-banner').style.display='none'">Reset Status</button>
      </div>
    </form>

    <div id="status-banner">SUCCESS: Form submitted autonomously by MakarDhwaj Agent!</div>
  </div>

  <script>
    let clickCount = 0;
    function handleSubmit() {
      clickCount++;
      const banner = document.getElementById('status-banner');
      banner.style.display = 'block';
      banner.textContent = `SUCCESS (Click #${clickCount}): Form submitted autonomously by MakarDhwaj Agent at ${new Date().toLocaleTimeString()}!`;
    }
  </script>
</body>
</html>
